<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Облако – чат панели</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">☁ Облако</div>
  <nav>
    <label>Пользователь:
      <select id="user">
        <option value="anna">Анна (владелец аккаунта)</option>
        <option value="boris">Борис (разработчик, только чтение)</option>
        <option value="olga">Ольга (инженер поддержки)</option>
      </select>
    </label>
    <a href="/support.html" target="_blank">Страница поддержки</a>
  </nav>
</header>

<main>
  <aside id="side">
    <div class="statusline">
      <span id="session-state">сессия не открыта</span>
      <span id="session-sub"></span>
    </div>
    <div class="hint">
      Спросите: «на какой я конфигурации», «почему списали 1 240»,
      «чем Про лучше Стандарта», «переведи сервер на Про».
    </div>
    <div id="tools"></div>
  </aside>

  <section id="chat">
    <div id="log"></div>
    <form id="form" autocomplete="off">
      <input id="text" placeholder="Сообщение…" disabled>
      <button id="send" type="submit" disabled>Отправить</button>
    </form>
  </section>
</main>

<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
