services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hosting
      POSTGRES_PASSWORD: hosting
      POSTGRES_DB: hosting
    ports:
      - "${PG_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hosting -d hosting"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
